<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a class="active" href="laboratorium.html">Laboratorium</a>
        <a href="radiologi.html">Radiologi</a>
        <a href="kasir.html">Kasir</a>
        <a href="login.html">Logout</a>
    </div>
    <div class="main">

        <div class="card">
            <h2>Laboratorium</h2>
            <input id="NamaPasien" placeholder="Nama Pasien">
            <select id="Pemeriksaan">
                <option>Hematologi</option>
                <option>Kimia Klinik</option>
                <option>Urinalisa</option>
                <option>Mikrobiologi</option>
                <option>Imunologi</option>
                <option>Tes Gula Darah</option>
                <option>Kolesterol</option>
                <option>Asam Urat</option>
                <option>Fungsi Hati</option>
                <option>Fungsi Ginjal</option>
            </select>
            <input id="Hasil" placeholder="Hasil Laboratorium">
            <button onclick="submit()">Simpan Hasil</button>
        </div>

           <script>
            let laboratorium = []

            const submit = () => {
                let NamaPasien = document.getElementById("NamaPasien").value
                let Pemeriksaan = document.getElementById("Pemeriksaan").value 
                let Hasil = document.getElementById("Hasil").value

                if (!NamaPasien) {
                    alert("Nama Pasien wajib diisi")
                } else if (!Hasil) {
                    alert("Hasil Laboratorium wajib diisi")
                } else {
                    alert("Berhasil simpan")
                    laboratorium.push({
                        nama: NamaPasien,
                        pemeriksaan: Pemeriksaan,
                        hasil: Hasil,
                    })
                    renderTable()
                    document.getElementById("NamaPasien").value = ""
                    document.getElementById("Hasil").value = ""
                }
            }

            const renderTable = () => {
                let html = ""
                laboratorium.forEach((item, index) => {
                    html += `
                <tr>
                    <td>${item.nama}</td>
                    <td>${item.pemeriksaan}</td>
                    <td>${item.hasil}</td>
                </tr>`
                })
                document.getElementById("tlaboratorium").innerHTML = html
            }
        </script>

        <div class="card">
            <h2>Data Pemeriksaan Lab</h2>
            <table>
                <tr>
                    <th>Pasien</th>
                    <th>Pemeriksaan</th>
                    <th>Hasil</th>
                </tr>
                <tbody>
                    <tr>
                        <td>Siti</td>
                        <td>Hematologi</td>
                        <td>Normal</td>
                    </tr>
                </tbody>
                <tbody id="tlaboratorium"></tbody>
            </table>
        </div>

    </div>
</body>

</html>
