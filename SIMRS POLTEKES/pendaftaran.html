<!-- FORM PENDAFTARAN -->
<main class="container">
    <h2>Formulir Pendaftaran Pasien</h2>

    <div class="form-card">

        <div class="form-group">
            <label>Nama Pasien</label>
            <input type="text" id="nama" placeholder="Masukkan Nama Pasien">
        </div>

        <div class="form-group">
            <label>No. RM</label>
            <input type="text" id="rm" placeholder="Masukkan Nomor Rekam Medis">
        </div>

        <div class="form-group">
            <label>NIK</label>
            <input type="text" id="nik" placeholder="Masukkan NIK">
        </div>

        <div class="form-group">
            <label>Tanggal Lahir</label>
            <input type="date" id="tgl_lahir">
        </div>

        <div class="form-group">
            <label>Tujuan Poliklinik</label>
            <select id="poliklinik">
                <option>Pilih Poliklinik</option>
                <option>Poli Umum</option>
                <option>Poli Anak</option>
                <option>Poli Gigi</option>
                <option>Poli Kandungan</option>
            </select>
        </div>

        <div class="form-group">
            <label>Dokter Poliklinik</label>
            <select id="dokter">
                <option>Pilih Dokter</option>
                <option>dr. Andi</option>
                <option>dr. Budi Sp.A</option>
                <option>drg. Agung</option>
                <option>dr. Shela Sp.O</option>
            </select>
        </div>

        <div class="form-button">
            <button onclick="simpanData()" class="btn-simpan">
                Simpan 
            </button>
        </div>

    </div>
</main>

<!-- JAVASCRIPT -->

function simpanData() {
    const nama = document.getElementById("nama").value;
    const rm = document.getElementById("rm").value;

    alert("Data tersimpan");
}
</script>

</body>
</html>
