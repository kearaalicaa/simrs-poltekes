<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMRS Login</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<!-- HEADER -->
<header class="header-menu">
    <div class="title">
        <h4>SIMRS POLTEKES KMC KUNINGAN</h4>
    </div>
    <nav class="menu">
        <a class="active" href="login.html">Login</a>
        <a href="index.html">Home</a>
        <a href="pengguna.html">Pengguna</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a href="rawatjalan.html">Rawat Jalan</a>
    </nav>
    <div class="button-auth">
        <button>Logout</button>
    </div>
</header>

<!-- FORM LOGIN -->
<main class="container">
    <h2>Login Sistem</h2>
    <div class="form-card">
        <form id="loginForm">
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan Username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan Password" required>
            </div>

            <div class="form-button">
                <button type="submit" class="btn-simpan">Login</button>
            </div>

        </form>
    </div>
</main>

</body>
</html>
