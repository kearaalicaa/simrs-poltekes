<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a href="laboratorium.html">Laboratorium</a>
        <a href="radiologi.html">Radiologi</a>
        <a class="active" href="kasir.html">Kasir</a>
        <a href="login.html">Logout</a>
    </div>
    <div class="main">

        <div class="card">
            <h2>Pembayaran</h2>
            <input id="NamaPasien" placeholder="Nama Pasien">
            <input id="Total" placeholder="Total">
            <button onclick="submit()">Bayar</button>
        </div>

        <script>
            let kasir = []

            const submit = () => {
                let NamaPasien = document.getElementById("NamaPasien").value
                let Total = document.getElementById("Total").value

                if (!NamaPasien) {
                    alert("Nama Pasien wajib diisi")
                } else if (!Total) {
                    alert("Total wajib diisi")
                } else {
                    alert("Berhasil simpan")
                    kasir.push({
                        nama: NamaPasien,
                        total: Total,
                        status: "Lunas"
                    })
                    renderTable()
                    document.getElementById("NamaPasien").value = ""
                    document.getElementById("Total").value = ""
                }
            }

            const renderTable = () => {
                let html = ""
                kasir.forEach((item, index) => {
                    html += `
                <tr>
                    <td>${item.nama}</td>
                    <td>${item.total}</td>
                    <td>${item.status}</td>
                </tr>`
                })
                document.getElementById("tkasir").innerHTML = html
            }
        </script>

        <div class="card">
            <h2>Riwayat Transaksi</h2>
            <table>
                <tr>
                    <th>Pasien</th>
                    <th>Total</th>
                    <th>Status</th>
                </tr>
                <tbody>
                    <tr>
                        <td>Budi</td>
                        <td>100000</td>
                        <td>Lunas</td>
                    </tr>
                </tbody>
                <tbody id="tkasir"></tbody>
            </table>
        </div>

    </div>
</body>

</html>
