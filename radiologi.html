<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a href="laboratorium.html">Laboratorium</a>
        <a class="active" href="radiologi.html">Radiologi</a>
        <a href="kasir.html">Kasir</a>
        <a href="login.html">Logout</a>
    </div>
    <div class="main">
        <div class="card">
            <h2>Radiologi</h2>
            <input id="NamaPasien" placeholder="Nama Pasien">
            <select id="Pemeriksaan">
                <option>X-Ray</option>
                <option>CT Scan</option>
                <option>MRI</option>
                <option>USG</option>
            </select>
            <input id="Hasil" placeholder="Hasil Radiologi">
            <button onclick="submit()">Simpan Hasil</button>
        </div>

        <script>
            let radiologi = []

            const submit = () => {
                let NamaPasien = document.getElementById("NamaPasien").value
                let Pemeriksaan = document.getElementById("Pemeriksaan").value 
                let Hasil = document.getElementById("Hasil").value

                if (!NamaPasien) {
                    alert("Nama Pasien wajib di isi")
                } else if (!Hasil) {
                    alert("Hasil radiologi harus diisi")
                } else {
                    alert("Berhasi simpan")
        
                    radiologi.push({
                        nama: NamaPasien,
                        pemeriksaan: Pemeriksaan,
                        hasil: Hasil,
                    })
                    renderTable()
                    document.getElementById("NamaPasien").value = ""
                    document.getElementById("Hasil").value = ""
               
                }
            }

            const renderTable = () => {
                let html = ""
                radiologi.forEach((item, index) => {
                    html += `
                <tr>
                    <td>${item.nama}</td>
                    <td>${item.pemeriksaan}</td>
                    <td>${item.hasil}</td>
                </tr>`
                })
                document.getElementById("tradiologi").innerHTML = html
            }
        </script>

        <div class="card">
            <h2>Data Radiologi</h2>
            <table>
                <tr>
                    <th>Pasien</th>
                    <th>Pemeriksaan</th>
                    <th>Hasil</th>
                </tr>
                <tbody>
                    <tr>
                        <td>Andi</td>
                        <td>X-Ray</td>
                        <td>Tidak ditemukan kelainan</td>
                    </tr>
                </tbody>
                <tbody id="tradiologi"></tbody>
            </table>
        </div>

    </div>
</body>

</html>
