<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a class="active" href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a href="laboratorium.html">Laboratorium</a>
        <a href="radiologi.html">Radiologi</a>
        <a href="kasir.html">Kasir</a>
        <a href="login.html">Logout</a>
    </div>
    <div class="main">

        <div class="card">
            <h2>Pemeriksaan Poli</h2>
            <input id="NamaPasien" placeholder="Nama Pasien">
            <input id="Diagnosa" placeholder="Diagnosa">
            <input id="Tindakan" placeholder="Tindakan">
            <button onclick="submit()">Simpan Pemeriksaan</button>
        </div>

        <script>
            let pemeriksaan = []

            const submit = () => {
                let NamaPasien = document.getElementById("NamaPasien").value
                let Diagnosa = document.getElementById("Diagnosa").value
                let Tindakan = document.getElementById("Tindakan").value

                if (!NamaPasien) {
                    alert("Nama Pasien wajib diisi")
                } else if (!Diagnosa) {
                    alert("Diagnosa wajib diisi")
                } else if (!Tindakan) {
                    alert("Tindakan wajib diisi")
                } else {
                    alert("Berhasil simpan")
                
                    pemeriksaan.push({
                        nama: NamaPasien,
                        diagnosa: Diagnosa,
                        tindakan: Tindakan,
                    })
                    renderTable()
                    document.getElementById("NamaPasien").value = ""
                    document.getElementById("Diagnosa").value = ""
                    document.getElementById("Tindakan").value = ""
                }
            }

            const renderTable = () => {
                let html = ""
                pemeriksaan.forEach((item, index) => {
                    html += `
            <tr>
                <td>${index + 2}</td>
                <td>${item.nama}</td>
                <td>${item.diagnosa}</td>
                <td>${item.tindakan}</td>
            </tr>`
                })
                document.getElementById("tpoli").innerHTML = html
            }
        </script>
        
        <div class="card">
            <h2>Antrian Poli</h2>
            <table>
                <tr>
                    <th>No</th>
                    <th>Nama Pasien</th>
                    <th>Diagnosa</th>
                    <th>Tindakan</th>
                </tr>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Budi</td>
                        <td>Typoid Fever</td>
                        <td>Infus</td>
                    </tr>
                </tbody>
                <tbody id="tpoli"></tbody>
            </table>
        </div>

    </div>
</body>

</html>
